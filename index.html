<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<title>HR Knowledge Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16193a; --muted:#6b6f8e; --line:#e7e8f3; --bg:#f4f4fb; --card:#fff;
  --brand:#4338ca; --brand-2:#7c3aed; --accent:#f59e0b; --ok:#16a34a; --ok-bg:#dcfce7;
  --bad:#dc2626; --bad-bg:#fee2e2; --radius:18px; --shadow:0 10px 30px -12px rgba(30,27,75,.25);
  font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.3rem;border-radius:14px;font-weight:600;transition:transform .08s,box-shadow .2s,background .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 20px -8px rgba(67,56,202,.7)}
.btn-primary:disabled{opacity:.5;box-shadow:none}
.btn-ghost{background:#eef0ff;color:var(--brand)}
.btn-light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-block{width:100%}
.btn-lg{padding:1.05rem 1.4rem;font-size:1.08rem}
.btn-sm{padding:.45rem .8rem;font-size:.85rem;border-radius:10px}

.alert{background:var(--bad-bg);color:var(--bad);padding:.75rem 1rem;border-radius:12px;font-size:.9rem;margin-bottom:1rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:.75rem 1.1rem;border-radius:12px;z-index:99;font-size:.92rem;max-width:90vw;box-shadow:var(--shadow)}

/* ---------- login ---------- */
.login-body{background:radial-gradient(120% 80% at 10% 0%,#6d28d9 0%,#312e81 45%,#0f0d2e 100%);min-height:100vh}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;max-width:460px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.login-hero{color:#fff;padding:12px 6px 28px}
.eyebrow{display:inline-block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.12);padding:.35rem .7rem;border-radius:99px;margin-bottom:18px}
.login-hero h1{font-size:2.3rem;line-height:1.15;font-weight:700}
.login-hero p{opacity:.8;margin-top:10px;font-size:1.02rem}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-chips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:.82rem;padding:.4rem .7rem;border-radius:99px}
.login-card{background:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.login-card h2{font-size:1.35rem;margin-bottom:6px}
.login-card .muted{margin-bottom:20px;font-size:.95rem}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border:1px solid #8c8c8c;border-radius:6px;background:#fff;color:#5e5e5e;font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:1rem;text-decoration:none;transition:background .15s}
.ms-btn:hover{background:#f3f3f3}
.ms-btn svg{width:21px;height:21px}
.fineprint{font-size:.78rem;color:var(--muted);margin-top:16px;text-align:center}
.demo-box{margin-top:18px;border-top:1px dashed var(--line);padding-top:18px}
.demo-box .tag{display:inline-block;background:#fef3c7;color:#92400e;font-size:.75rem;font-weight:600;padding:.25rem .55rem;border-radius:6px;margin-bottom:10px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:.75rem .85rem;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}

/* ---------- app shell ---------- */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(244,244,251,.88);backdrop-filter:blur(12px)}
.topbar .who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.who-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:6px;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(30,27,75,.2);margin-bottom:14px}
.card h3{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* home */
.hero-card{background:linear-gradient(140deg,#4338ca,#7c3aed 60%,#a855f7);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-card h1{font-size:1.5rem;line-height:1.25;position:relative}
.hero-card p{opacity:.85;margin:6px 0 18px;position:relative;font-size:.95rem}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;position:relative}
.rules div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 8px;text-align:center}
.rules b{display:block;font-size:1.3rem}
.rules small{opacity:.85;font-size:.75rem}
.hero-card .btn{background:#fff;color:var(--brand);box-shadow:none;position:relative}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.25rem}
.stat small{color:var(--muted);font-size:.75rem}
.lb{list-style:none}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb .rk{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--bg);flex:none}
.lb li:nth-child(1) .rk{background:#fde68a}.lb li:nth-child(2) .rk{background:#e5e7eb}.lb li:nth-child(3) .rk{background:#fed7aa}
.lb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pt{font-weight:700;color:var(--brand)}
.lb li.me{background:#eef0ff;border-radius:10px}
.hist{list-style:none;font-size:.9rem}
.hist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border:0}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:.2rem .55rem;border-radius:99px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mid{background:#eef0ff;color:var(--brand)}

/* play */
.play-head{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.timer{position:relative;width:62px;height:62px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .track{stroke:#e4e4f3}
.timer .bar{stroke:var(--brand);transition:stroke .3s}
.timer.warn .bar{stroke:var(--bad)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.25rem}
.timer.warn .num{color:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.progress-wrap{flex:1}
.progress-meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.progress{height:10px;background:#e4e4f3;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .4s}
.scorebar{display:flex;gap:8px;margin-bottom:12px}
.scorebar span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:.35rem .8rem;font-size:.88rem;font-weight:600}
.scorebar .streak{color:#c2410c}
.qcard{background:#fff;border-radius:22px;padding:20px 18px;box-shadow:var(--shadow);margin-bottom:14px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.qcat{font-size:.78rem;color:var(--brand);font-weight:600;letter-spacing:.02em}
.qtext{font-size:1.18rem;line-height:1.5;font-weight:600;margin-top:6px}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;min-height:60px;font-size:1rem;line-height:1.4;transition:border .15s,background .15s,transform .08s}
.choice:active{transform:scale(.98)}
.choice .L{flex:none;width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:700;color:var(--brand)}
.choice.picked{border-color:var(--brand);background:#eef0ff}
.choice.correct{border-color:var(--ok);background:var(--ok-bg)}.choice.correct .L{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}.choice.wrong .L{background:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.choices.locked .choice:not(.correct):not(.wrong){opacity:.55}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 40px -20px rgba(0,0,0,.35);animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
.feedback .inner{max-width:560px;margin:0 auto}
.fb-title{display:flex;align-items:center;justify-content:space-between;font-size:1.2rem;font-weight:700;margin-bottom:6px}
.feedback.ok .fb-title{color:var(--ok)}.feedback.bad .fb-title{color:var(--bad)}
.fb-gain{font-size:1rem;background:var(--ok-bg);color:var(--ok);padding:.2rem .6rem;border-radius:99px}
.feedback.bad .fb-gain{background:var(--bad-bg);color:var(--bad)}
.fb-exp{font-size:.93rem;color:#3f4366;line-height:1.55;margin-bottom:14px;max-height:30vh;overflow:auto}
.float-pts{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:2.4rem;font-weight:800;color:var(--ok);pointer-events:none;z-index:30;animation:floatUp 1s ease forwards}
@keyframes floatUp{to{opacity:0;transform:translate(-50%,-80px)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result */
.result-hero{text-align:center;padding:26px 18px}
.result-hero .emoji{font-size:3rem}
.result-hero h2{font-size:1.5rem;margin:6px 0 4px}
.ring{width:150px;height:150px;margin:16px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-weight:800}
.ring .num small{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
.review{list-style:none;counter-reset:r}
.review li{padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.review li:last-child{border:0}
.review .rq{font-weight:600;margin-bottom:4px}
.review .ra{color:var(--muted)}
.review .ok{color:var(--ok)}.review .bad{color:var(--bad)}
.actions{display:grid;gap:10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- admin ---------- */
.admin-body .wrap{max-width:1100px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;position:sticky;top:56px;z-index:9;background:var(--bg)}
.tabs button{flex:none;padding:.6rem 1rem;border-radius:12px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>.card{margin:0}}
.kpi{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}
.kpi small{color:var(--muted);font-size:.8rem}
.kpi b{display:block;font-size:1.7rem;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:8px 8px 3px 3px;min-height:3px;transition:height .5s}
.bars .b small{font-size:.72rem;color:var(--muted)}
.bars .b span{font-size:.8rem;font-weight:600}
.qstat{padding:10px 0;border-bottom:1px solid var(--line)}
.qstat:last-child{border:0}
.qstat .t{font-size:.88rem;margin-bottom:6px}
.meter{height:8px;background:#eceef8;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px;padding:.65rem .85rem;border:1px solid var(--line);border-radius:12px;background:#fff}
.table-wrap{overflow-x:auto;background:#fff;border-radius:16px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.88rem;white-space:nowrap}
th,td{padding:.7rem .8rem;text-align:left;border-bottom:1px solid var(--line)}
th{background:#fafaff;font-weight:600;color:var(--muted);font-size:.8rem;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.qitem{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.qitem .body{flex:1;min-width:0}
.qitem .t{font-weight:600;line-height:1.45}
.qitem .meta{font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.qitem .ops{display:flex;gap:6px;flex:none}
.qitem.off{opacity:.55}
.modal{position:fixed;inset:0;background:rgba(15,13,46,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal{align-items:center}}
.modal .sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal .sheet{border-radius:22px}}
.modal h3{margin-bottom:14px}
.choice-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.choice-row input[type=text]{flex:1;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px}
.choice-row label{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.switch input[type=checkbox]{width:46px;height:26px;appearance:none;background:#d6d8e8;border-radius:99px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input[type=checkbox]:checked{background:var(--brand)}
.switch input[type=checkbox]:checked::after{left:23px}
.switch input[type=number]{width:90px;padding:.5rem .6rem;border:1px solid var(--line);border-radius:10px;text-align:right}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:.92rem}

.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spinner{width:38px;height:38px;border:4px solid #e4e4f3;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.dialog-back{position:fixed;inset:0;background:rgba(15,13,46,.55);z-index:60;display:grid;place-items:center;padding:20px}
.dialog{background:#fff;border-radius:20px;padding:20px;max-width:380px;width:100%}
.dialog p{margin:6px 0 16px;line-height:1.5}
.dialog .row{display:flex;gap:8px;justify-content:flex-end}
.dialog input{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:.9rem}
.kv b{color:var(--muted);font-weight:500}
.kv span{word-break:break-all}
code{background:#eef0ff;padding:.1rem .35rem;border-radius:6px;font-size:.85em}
/* ---- modes ---- */
.hero-stats{position:relative;margin-top:4px}
.hero-stats .stat{background:rgba(255,255,255,.14)}
.hero-stats .stat small{color:rgba(255,255,255,.85)}
.sec-title{font-size:1rem;margin:4px 2px 10px}
.mode-grid{display:grid;gap:10px;margin-bottom:12px}
.mode-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;transition:transform .08s,border .15s,box-shadow .15s;position:relative;overflow:hidden}
.mode-card:active{transform:scale(.98)}
.mode-card:hover{border-color:#c7c9f5;box-shadow:0 8px 20px -14px rgba(67,56,202,.6)}
.mode-card:disabled{opacity:.5;cursor:not-allowed}
.mode-card .mi{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem}
.m-classic .mi{background:#eef0ff}.m-attack .mi{background:#fef3c7}.m-survival .mi{background:#fee2e2}.m-practice .mi{background:#dcfce7}
.mode-card .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mode-card .mt b{font-size:1.05rem}
.mode-card .mt small{color:var(--muted);font-size:.82rem;line-height:1.4}
.mode-card .mb{flex:none;font-size:.72rem;font-weight:600;background:var(--bg);color:var(--muted);padding:.3rem .55rem;border-radius:99px;align-self:flex-start}
.m-classic .mb{background:#eef0ff;color:var(--brand)}
.cat-select{margin-top:6px;padding:.4rem .5rem;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:.82rem;max-width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button,.seg label{padding:.4rem .75rem;border-radius:99px;background:var(--bg);font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--ink);color:#fff}
/* ---- play extras ---- */
.scorebar{align-items:center;flex-wrap:wrap}
.mode-chip{background:var(--ink)!important;color:#fff;border-color:var(--ink)!important}
.lives{letter-spacing:2px;background:#fff1f2!important;border-color:#fecdd3!important}
.scorebar span{padding:.3rem .65rem!important;font-size:.84rem!important}
.quit{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:700}
.timer.practice .bar{stroke:var(--ok)}
.qtype{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;margin-right:8px;background:#eef0ff;color:var(--brand)}
.qtype.t-tf{background:#fef3c7;color:#92400e}.qtype.t-num{background:#dcfce7;color:#166534}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:130px;border-radius:22px;font-size:1.2rem;font-weight:700;border:3px solid transparent;transition:transform .08s,opacity .2s}
.tf-btn span{font-size:2.4rem;line-height:1}
.tf-btn:active{transform:scale(.96)}
.tf-yes{background:#dcfce7;color:#15803d}.tf-no{background:#fee2e2;color:#b91c1c}
.tf-btn.correct{border-color:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.18)}
.tf-btn.wrong{border-color:var(--bad);box-shadow:0 0 0 4px rgba(220,38,38,.18)}
.tf-grid.locked .tf-btn:not(.correct):not(.wrong){opacity:.4}
.numpad{background:#fff;border-radius:22px;padding:14px;box-shadow:0 1px 0 var(--line)}
.num-display{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:14px;border:2px solid var(--line);border-radius:16px;margin-bottom:12px;transition:border .2s,background .2s}
.num-display span{font-size:2.6rem;font-weight:800;min-width:1ch;text-align:center}
.num-display span.ph{color:#c7c9de}
.num-display small{color:var(--muted);font-size:1rem}
.num-display.ok{border-color:var(--ok);background:var(--ok-bg)}.num-display.bad{border-color:var(--bad);background:var(--bad-bg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:56px;border-radius:14px;background:var(--bg);font-size:1.35rem;font-weight:700;transition:transform .06s,background .1s}
.keys button:active{transform:scale(.94);background:#e4e6f5}
.keys .k-ok{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.keys .k-del{color:var(--muted)}
.keys button:disabled{opacity:.45}
.num-correct{margin-top:10px;text-align:center;color:var(--ok);font-weight:700}
.flash{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:35;font-size:3.4rem;font-weight:800;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;color:#fff;animation:pop .45s ease;pointer-events:none}
.flash.ok{background:rgba(22,163,74,.92)}.flash.bad{background:rgba(220,38,38,.92)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.hero-card{background:var(--hero,linear-gradient(140deg,#4338ca,#7c3aed 60%,#a855f7))!important}
.login-body{background:var(--login-bg,radial-gradient(120% 80% at 10% 0%,#6d28d9 0%,#312e81 45%,#0f0d2e 100%))!important}
.topbar{background:color-mix(in srgb,var(--bg) 88%,transparent)!important}
.tabs{background:var(--bg)!important}
.hero-card .btn{color:var(--brand)!important}
.eyebrow{margin-right:8px}
.theme-icon{font-size:1.6rem;vertical-align:middle}
.hero-card .theme-icon{position:absolute;right:16px;top:12px;font-size:2.6rem;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
.login-hero .theme-icon{display:inline-block;font-size:2rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.theme-greet{position:relative;display:inline-block;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;padding:.3rem .7rem;border-radius:99px;margin-bottom:12px;max-width:calc(100% - 56px)}
.login-hero .theme-greet{display:block;width:max-content;max-width:100%;margin:14px 0 0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
body.playing #fx{display:none}
.fx{position:absolute;top:0;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite;user-select:none}
.fx-fall{animation-name:fxFall}.fx-rise{animation-name:fxRise}.fx-drift{animation-name:fxDrift}
@keyframes fxFall{from{transform:translate(0,-8vh) rotate(0)}50%{transform:translate(24px,50vh) rotate(180deg)}to{transform:translate(-12px,108vh) rotate(360deg)}}
@keyframes fxRise{from{transform:translate(0,108vh) scale(.8)}50%{transform:translate(-18px,50vh) scale(1)}to{transform:translate(12px,-10vh) scale(.9)}}
@keyframes fxDrift{from{transform:translate(-10vw,20vh) rotate(-10deg)}25%{transform:translate(20vw,5vh) rotate(8deg)}50%{transform:translate(45vw,35vh) rotate(-6deg)}75%{transform:translate(70vw,10vh) rotate(10deg)}to{transform:translate(110vw,25vh) rotate(-8deg)}}
@media (prefers-reduced-motion: reduce){#fx{display:none}.theme-icon{animation:none!important}}
.month-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.month-grid{grid-template-columns:repeat(3,1fr)}}
.month{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 8px}
.month span{width:40px;font-size:.82rem;font-weight:600;flex:none}
.month select{flex:1;min-width:0;padding:.35rem;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.8rem}
.qr-preview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;max-width:320px;margin:0 auto 6px}
.qr-preview canvas{width:100%;height:auto;display:block}
.poster-preview{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:10px;border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(30,27,75,.5);aspect-ratio:1240/1754;background:#f1f2f8}
.share-card{display:flex;gap:16px;align-items:center}
.share-card canvas{width:110px;height:110px;flex:none;border-radius:12px;border:1px solid var(--line)}
#printArea{display:none}
@media print{@page{size:A4;margin:0}body>*:not(#printArea){display:none!important}#printArea{display:block!important}#printArea img{width:100%;height:auto;display:block}}
.set-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set-box{background:var(--bg);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px}
.set-box .big{font-size:1.6rem;font-weight:800;color:var(--brand)}
.set-box small{color:var(--muted);font-size:.75rem}
.set-pill{background:var(--ink);color:#fff}
.qcard.ok{box-shadow:0 0 0 3px var(--ok)}.qcard.bad{box-shadow:0 0 0 3px var(--bad)}
</style>
</head>

<!-- ============================ 1. LOGIN ============================ -->

<!-- ============================ 2. QUIZ ============================ -->
<template id="tpl-quiz">
<header class="topbar">
  <div class="who"><div class="avatar" id="avatar"></div><div class="who-name" id="userName"></div></div>
  <div class="top-actions">

    <button id="logout" class="btn btn-light btn-sm">ออกจากระบบ</button>
  </div>
</header>
<main class="wrap">
  <section id="home">
    <div class="hero-card">
      <span class="theme-icon" data-theme-icon></span>
      <div class="theme-greet" data-theme-greet></div>
      <h1 data-bind="title"></h1>
      <p data-bind="subtitle"></p>
      <div class="stats3 hero-stats">
        <div class="stat"><b id="sBest">0</b><small>คะแนนสูงสุด</small></div>
        <div class="stat"><b id="sRank">–</b><small>อันดับ</small></div>

      </div>
    </div>
    <h3 class="sec-title">เลือกโหมดเกม</h3>
    <div class="mode-grid" id="modes"></div>
    <p id="startNote" class="small muted" style="margin:-4px 2px 14px"></p>

    <div class="card" id="lbCard">
      <h3>🏆 Leaderboard</h3>
      <div class="seg" id="lbTabs"></div>
      <ol class="lb" id="lb"></ol>
    </div>
    <div class="card">
      <h3>วิธีเก็บคะแนน</h3>

        <li><span>⚡ ตอบเร็ว (Classic / Survival)</span><b>สูงสุด +50</b></li>
        <li><span>🔥 ตอบถูกติดกัน 3 ข้อขึ้นไป</span><b>+25 / ข้อ</b></li>
        <li><span>⚡ Time Attack: Combo 3+ ข้อ</span><b>+50 / ข้อ</b></li>
      </ul>
    </div>
    <div class="card" id="histCard"><h3>ประวัติการเล่น</h3><ul class="hist" id="hist"></ul></div>
    <div class="card share-card hidden" id="shareCard">
      <canvas id="shareQR" width="240" height="240"></canvas>
      <div><h3 style="margin-bottom:4px">📱 ชวนเพื่อนมาเล่น</h3><p class="small muted">ให้เพื่อนสแกน QR นี้ หรือส่งลิงก์</p><button class="btn btn-ghost btn-sm" id="shareCopy" style="margin-top:8px">🔗 คัดลอกลิงก์</button></div>
    </div>

        <div class="month-grid" id="monthGrid"></div>
        <p class="small muted" style="margin-top:10px">💡 เลือกธีมจากรายการด้านบนเพื่อพรีวิวได้ทันที — กด “บันทึกการตั้งค่า” เพื่อใช้กับทุกคน</p>

  Questions: { sheet: 'Questions', table: 'tblQuestions', keys: ['id', 'category', 'text', 'A', 'B', 'C', 'D', 'answer', 'explanation', 'active', 'type', 'set'],
    head: ['ID', 'หมวด', 'คำถาม', 'ตัวเลือก A', 'ตัวเลือก B', 'ตัวเลือก C', 'ตัวเลือก D', 'คำตอบที่ถูก (A-D)', 'คำอธิบาย', 'ใช้งาน (Y/N)', 'ประเภท (mc/tf/num)', 'ชุดข้อสอบ (A/B/C)'] },
  Settings: { sheet: 'Settings', table: 'tblSettings', keys: ['key', 'value'], head: ['Key', 'Value'] },

const NUMERIC = new Set(['points', 'correct', 'total', 'percent', 'durationSec', 'attemptNo', 'bestStreak', 'questionNo', 'timeSec']);
const colLetter = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const SETS = ['A', 'B', 'C'];
const normSet = v => { const x = String(v ?? '').trim().toUpperCase().replace(/^ชุด\s*/, ''); return SETS.includes(x) ? x : ''; };

function rowToQ(o) {
  const type = ['mc', 'tf', 'num'].includes(String(o.type || '').trim().toLowerCase()) ? String(o.type).trim().toLowerCase() : 'mc';
  const base = { id: String(o.id || 'q' + Math.random().toString(36).slice(2, 9)), type, category: String(o.category || ''), text: String(o.text || '').trim(), explanation: String(o.explanation || ''), active: String(o.active || 'Y').toUpperCase() !== 'N', set: normSet(o.set) };
  if (!base.text) return null;
  if (type === 'num') { const v = Number(String(o.A ?? '').trim()); if (String(o.A ?? '').trim() === '' || !Number.isFinite(v)) return null; return { ...base, choices: [String(v), String(o.B ?? '').trim()], answer: 0 }; }

let pca = null;

  },
  async init() {
    const b64 = btoa(unescape(encodeURIComponent(CONFIG.excelShareUrl.trim()))).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
    const item = await this.call('GET', 'https://graph.microsoft.com/v1.0/shares/u!' + b64 + '/driveItem');
    this.base = `https://graph.microsoft.com/v1.0/drives/${item.parentReference.driveId}/items/${item.id}/workbook`;
    this.webUrl = item.webUrl; this.fileName = item.name;
    const have = new Set((await this.call('GET', '/tables?$select=name')).value.map(t => t.name));
    const missing = Object.keys(COLS).filter(k => !have.has(COLS[k].table));
    for (const k of Object.keys(COLS).filter(k => have.has(COLS[k].table))) { // add columns introduced by newer versions
      const n = (await this.call('GET', `/tables/${COLS[k].table}/columns?$select=name`)).value.length;
      for (let i = n; i < COLS[k].head.length; i++) await this.call('POST', `/tables/${COLS[k].table}/columns/add`, { name: COLS[k].head[i] });

    if (!missing.length) return;
    if (!ME.isAdmin) throw new Error('ไฟล์ Excel ยังไม่ได้ตั้งค่า — ให้ผู้ดูแลระบบเข้าสู่ระบบก่อน 1 ครั้งเพื่อสร้างชีตอัตโนมัติ');
    for (const k of ['Scores', 'Answers', 'Questions', 'Settings'].filter(k => missing.includes(k))) {
      const seed = k === 'Questions' ? DEFAULT_QUESTIONS.map(qToRow) : k === 'Settings' ? Object.entries(DEFAULT_SETTINGS).map(([a, b]) => [a, String(b)]) : [];

const STORE = MODE === 'ms' ? GraphStore : DemoStore;
let ME = null, SETTINGS = { ...DEFAULT_SETTINGS }, QUESTIONS = [], ATTEMPTS = [], ANSWERS = [];

async function reloadData(withAnswers = false) {
  [SETTINGS, QUESTIONS, ATTEMPTS] = await Promise.all([STORE.getSettings(), STORE.getQuestions(), STORE.getAttempts()]);
  if (withAnswers) ANSWERS = await STORE.getAnswers();

async function boot() {
  if (MODE === 'ms') {
    if (location.protocol === 'file:') return showLogin('เปิดไฟล์จากเครื่องโดยตรง (file://) ใช้ Microsoft login ไม่ได้ — ต้องนำไฟล์ขึ้นเว็บ https:// (หรือ http://localhost) และใส่ลิงก์นั้นเป็น Redirect URI ใน Azure');
    if (!window.msal) return showLogin('โหลดไลบรารี Microsoft ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต หรือเครือข่ายบริษัทอาจบล็อก alcdn.msauth.net');
    pca = new msal.PublicClientApplication({
      auth: { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId || 'organizations'}`, redirectUri: location.origin + location.pathname },
      cache: { cacheLocation: 'localStorage' },
    });
    let res = null;
    try { res = await pca.handleRedirectPromise(); } catch (e) { return showLogin(explainMsalError(e)); }
    const acc = res?.account || pca.getActiveAccount() || pca.getAllAccounts()[0];
    if (acc) { pca.setActiveAccount(acc); ME = { name: acc.name || acc.username, email: acc.username.toLowerCase() }; }
  } else ME = LS.get('demoUser', null);

  if (!ME) return showLogin();
  if (CONFIG.allowedDomains.length && !CONFIG.allowedDomains.map(d => d.toLowerCase()).includes(ME.email.split('@')[1])) {
    return showLogin('บัญชีนี้ไม่ได้รับอนุญาต กรุณาใช้อีเมลขององค์กร', true);
  }
  ME.isAdmin = MODE === 'demo' ? true : CONFIG.adminEmails.map(e => e.toLowerCase()).includes(ME.email);

  setLoading('กำลังเชื่อมต่อข้อมูล…');
  try { await STORE.init(); await reloadData(); }
  catch (e) { console.error(e); setLoading(''); $('#app .loading div').innerHTML = `<div style="max-width:340px;text-align:center;padding:20px"><div style="font-size:2.4rem">⚠️</div><p style="margin:10px 0 16px">${esc(e.message)}</p><button class="btn btn-light" onclick="logout()">ออกจากระบบ</button></div>`; return; }
  flushPending();
  route();
}
function explainMsalError(e) {
  const m = String(e.errorMessage || e.message || e);
  if (/AADSTS50011/.test(m)) return 'Redirect URI ไม่ตรง — ใน Azure ให้เพิ่ม "' + location.origin + location.pathname + '" ใต้ Single-page application';
  if (/AADSTS9002326|AADSTS700054|Cross-origin token redemption/.test(m)) return 'แอปใน Azure ต้องเป็นประเภท "Single-page application" (ไม่ใช่ Web)';
  if (/AADSTS65001|consent/i.test(m)) return 'ยังไม่ได้รับอนุญาตสิทธิ์ — ให้ IT กด "Grant admin consent" ใน API permissions';
  if (/AADSTS50020|AADSTS90072/.test(m)) return 'บัญชีนี้ไม่อยู่ในองค์กร (tenant) ที่กำหนด';
  if (/AADSTS700016/.test(m)) return 'ไม่พบ clientId นี้ใน tenant — ตรวจ clientId / tenantId ใน CONFIG';
  return 'เข้าสู่ระบบไม่สำเร็จ: ' + m;
}

async function showLogin(err, forceLogout = false) {

  }
  $('#msBtn').onclick = async () => {

    if (MODE === 'demo') return showErr('ยังไม่ได้ตั้งค่า Microsoft — ตอนนี้ใช้ฟอร์ม "โหมดทดลอง" ด้านล่างได้เลย หรือใส่ clientId, tenantId และ excelShareUrl ใน CONFIG');

  };

    e.preventDefault();

/* =================================================================
   2. QUIZ — modes: classic · attack · survival · practice
            types: mc (choice) · tf (true/false) · num (number keypad)
================================================================= */
const C_TIMER = 2 * Math.PI * 27, C_RING = 2 * Math.PI * 64;
const MODES = {
  classic:  { icon: '🎯', name: 'Classic', flag: null, desc: s => setsReady() ? `สุ่ม 1 ใน ${availSets().length} ชุดข้อสอบ · ${s.timePerQuestion} วิ/ข้อ · วัดผลผ่าน/ไม่ผ่าน` : `${Math.min(s.questionsPerQuiz, activeQs().length)} ข้อ · ${s.timePerQuestion} วิ/ข้อ · วัดผลผ่าน/ไม่ผ่าน` },
  attack:   { icon: '⚡', name: 'Time Attack', flag: 'modeAttack', desc: s => `${s.attackSeconds} วินาที ตอบให้ได้มากที่สุด` },
  survival: { icon: '❤️', name: 'Survival', flag: 'modeSurvival', desc: s => `${s.survivalLives} ชีวิต ตอบผิดเสียชีวิต อยู่รอดให้นานที่สุด` },
  practice: { icon: '📖', name: 'Practice', flag: 'modePractice', desc: () => 'ฝึกทบทวนรายหมวด ไม่จับเวลา ไม่บันทึกคะแนน' },
};
const TYPE_LABEL = { mc: 'เลือกตอบ', tf: 'ถูกหรือผิด?', num: 'เติมตัวเลข' };
const qType = q => q.type || 'mc';
const attemptMode = a => a.mode || 'classic';
const modeOn = m => !MODES[m].flag || !!SETTINGS[MODES[m].flag];
let GAME = null, RAF = null, LB_MODE = 'classic', PRACTICE_CAT = '', LAST_MODE = 'classic';
const myAttempts = (mode = 'classic') => ATTEMPTS.filter(a => a.email === ME.email && attemptMode(a) === mode);
const activeQs = () => QUESTIONS.filter(q => q.active !== false);
function leaderboard(mode = 'classic', limit = 10) {
  const best = new Map();
  for (const a of ATTEMPTS) { if (attemptMode(a) !== mode) continue; const b = best.get(a.email); if (!b || a.points > b.points || (a.points === b.points && a.durationSec < b.durationSec)) best.set(a.email, a); }
  return [...best.values()].sort((x, y) => y.points - x.points || x.durationSec - y.durationSec).slice(0, limit);
}
function attemptsLeft() { return SETTINGS.maxAttempts > 0 ? Math.max(0, SETTINGS.maxAttempts - myAttempts('classic').length) : null; }
const availSets = () => SETS.filter(k => QUESTIONS.some(q => q.active !== false && q.set === k));
const setsReady = () => SETTINGS.useSets && availSets().length > 0;
function pickSet() {
  // each player gets a random set; retakes get a set they have not done yet (cycles after all sets are used)
  const avail = availSets(), mine = myAttempts('classic').sort((a, b) => sortKey(a.timestamp) - sortKey(b.timestamp)).map(a => a.set).filter(Boolean);
  let cand = avail.filter(k => !mine.includes(k));
  if (!cand.length) { const last = mine[mine.length - 1]; cand = avail.length > 1 ? avail.filter(k => k !== last) : avail; }
  return cand[Math.floor(Math.random() * cand.length)];
}
const bestOf = mode => myAttempts(mode).reduce((m, a) => Math.max(m, a.points), 0);

function showQuiz() {
  mount('#tpl-quiz');
  $('#userName').textContent = ME.name;
  $('#avatar').textContent = (ME.name || '?').trim().charAt(0).toUpperCase();

  $('#logout').onclick = logout;

function showSection(id) { ['home', 'play', 'result'].forEach(s => $('#' + s).classList.toggle('hidden', s !== id)); document.body.classList.toggle('playing', id === 'play'); window.scrollTo(0, 0); }

function renderHome() {
  stopTimer(); GAME = null;
  $('#feedback').classList.add('hidden');
  const left = attemptsLeft(), closed = !SETTINGS.isOpen && !ME.isAdmin;

    else if (m !== 'practice') { const b = bestOf(m); badge = b ? `สถิติ ${b}` : 'ยังไม่เคยเล่น'; }
    else badge = 'ไม่บันทึกผล';
    const extra = m === 'practice' ? `<select class="cat-select" id="pracCat"><option value="">ทุกหมวด (${activeQs().length} ข้อ)</option>${cats.map(c => `<option ${c === PRACTICE_CAT ? 'selected' : ''} value="${esc(c)}">${esc(c)} (${activeQs().filter(q => q.category === c).length})</option>`).join('')}</select>` : '';
    return `<button class="mode-card m-${m}" data-mode="${m}" ${disabled ? 'disabled' : ''}><span class="mi">${d.icon}</span><span class="mt"><b>${d.name}</b><small>${esc(d.desc(SETTINGS))}</small>${extra}</span><span class="mb">${esc(badge)}</span></button>`;
  }).join('');
  $('#pracCat')?.addEventListener('change', e => { PRACTICE_CAT = e.target.value; });
  const note = $('#startNote');
  note.textContent = closed ? '⛔ ขณะนี้ปิดรับการเล่นชั่วคราว' : myAttempts('classic').some(a => a.result === 'ผ่าน') ? '✅ คุณผ่านแบบทดสอบ Classic แล้ว — เล่นโหมดอื่นเพื่อทำสถิติได้' : 'ผลสอบผ่าน/ไม่ผ่านนับจากโหมด Classic เท่านั้น';
  renderLeaderboard();

  if (su) { const c = $('#shareQR'); drawQR(c.getContext('2d'), su, 0, 0, c.width, { logo: THEMES[currentThemeKey()].icon }); $('#shareCopy').onclick = () => copyText(su); }
  const mine = ATTEMPTS.filter(a => a.email === ME.email).sort((a, b) => sortKey(b.timestamp) - sortKey(a.timestamp));
  $('#histCard').classList.toggle('hidden', !mine.length);
  $('#hist').innerHTML = mine.slice(0, 10).map(h => { const m = MODES[attemptMode(h)] || MODES.classic;
    return `<li><span>${m.icon}${h.set ? ` <b class="small">ชุด ${esc(h.set)}</b>` : ''} ${fmtDate(h.timestamp)}</span><span><b>${h.points}</b> · ${h.correct}/${h.total} ${attemptMode(h) === 'classic' ? `<span class="pill ${h.result === 'ผ่าน' ? 'ok' : 'bad'}">${esc(h.result)}</span>` : ''}</span></li>`; }).join('');
  showSection('home');
}
function renderLeaderboard() {
  $('#lbCard').classList.toggle('hidden', !SETTINGS.showLeaderboard);
  const modes = ['classic', 'attack', 'survival'].filter(modeOn);
  if (!modes.includes(LB_MODE)) LB_MODE = 'classic';
  $('#lbTabs').innerHTML = modes.length > 1 ? modes.map(m => `<button data-lb="${m}" class="${m === LB_MODE ? 'on' : ''}">${MODES[m].icon} ${MODES[m].name}</button>`).join('') : '';
  const lb = leaderboard(LB_MODE);
  $('#lb').innerHTML = lb.length ? lb.map((x, i) => `<li class="${x.email === ME.email ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(x.name)}${x.email === ME.email ? ' (คุณ)' : ''}</span><span class="pt">${x.points}</span></li>`).join('') : '<div class="empty">ยังไม่มีใครเล่นโหมดนี้ — เป็นคนแรกเลย!</div>';
}

async function startGame(mode) {
  try { await reloadData(); } catch {}
  if (!SETTINGS.isOpen && !ME.isAdmin) { toast('ขณะนี้ปิดรับการเล่นแล้ว'); return renderHome(); }
  if (!modeOn(mode)) { toast('โหมดนี้ถูกปิดอยู่'); return renderHome(); }
  if (mode === 'classic' && attemptsLeft() === 0 && !ME.isAdmin) { toast('คุณใช้สิทธิ์ Classic ครบแล้ว — ลองโหมดอื่นได้'); return renderHome(); }
  let pool = activeQs().slice();
  if (mode === 'practice' && PRACTICE_CAT) pool = pool.filter(q => q.category === PRACTICE_CAT);
  if (!pool.length) return toast('ยังไม่มีคำถามในระบบ');
  let set = '';
  if (mode === 'classic' && setsReady()) { set = pickSet(); pool = pool.filter(q => q.set === set); }
  if (SETTINGS.shuffleQuestions || mode !== 'classic') shuffle(pool);
  if (mode === 'classic' && !set) pool = pool.slice(0, Math.min(SETTINGS.questionsPerQuiz, pool.length));
  LAST_MODE = mode;
  GAME = {
    mode, set, id: 'A' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase(),
    items: pool.map(q => { const order = q.choices.map((_, i) => i); if (qType(q) === 'mc' && SETTINGS.shuffleChoices) shuffle(order); return { q, order }; }),
    idx: 0, points: 0, correct: 0, streak: 0, bestStreak: 0, startedAt: Date.now(), log: [],
    limit: SETTINGS.timePerQuestion, lives: SETTINGS.survivalLives, maxLives: SETTINGS.survivalLives,
    attemptNo: myAttempts(mode).length + 1, prevBest: bestOf(mode), locked: false, timeUp: false, num: '',
  };
  $('#modeChip').textContent = `${MODES[mode].icon} ${MODES[mode].name}${set ? ' · ชุด ' + set : ''}`;
  if (set) toast(`🎲 คุณได้ข้อสอบ ชุด ${set} (${pool.length} ข้อ)`);
  if (mode === 'attack') { const t = SETTINGS.attackSeconds; startTimer(performance.now() + t * 1000, t); }
  renderQuestion();
}
async function quitGame() {
  if (!GAME) return renderHome();
  const warn = GAME.mode === 'practice' ? 'ออกจากการฝึก?' : GAME.mode === 'classic' ? 'ออกจากเกม? รอบนี้จะไม่ถูกบันทึกและไม่เสียสิทธิ์' : 'ออกจากเกม? รอบนี้จะไม่ถูกบันทึก';
  stopTimerIfPerQ();
  if (await dialog({ text: warn, ok: 'ออก', danger: true })) renderHome();
  else if (GAME && !GAME.locked) { if (GAME.mode === 'classic' || GAME.mode === 'survival') startTimer(GAME.servedAt + GAME.limit * 1000, GAME.limit); }
}

function renderQuestion() {
  $('#feedback').classList.add('hidden');
  const g = GAME, it = g.items[g.idx], t = qType(it.q);
  g.locked = false; g.num = '';
  const total = g.items.length;
  if (g.mode === 'attack') { $('#qIndex').textContent = `ข้อที่ ${g.idx + 1}`; $('#qPct').textContent = `✔ ${g.correct}`; }
  else { $('#qIndex').textContent = `ข้อ ${g.idx + 1}/${total}`; const pct = Math.round(g.idx / total * 100); $('#qPct').textContent = pct + '%'; $('#progBar').style.width = pct + '%'; }
  $('#pts').textContent = g.points; $('#streak').textContent = '🔥 ' + g.streak;
  $('#lives').classList.toggle('hidden', g.mode !== 'survival');
  if (g.mode === 'survival') $('#lives').textContent = '❤️'.repeat(g.lives) + '🤍'.repeat(Math.max(0, g.maxLives - g.lives));
  $('#timer').classList.toggle('practice', g.mode === 'practice');
  if (g.mode === 'practice') { $('#timerNum').textContent = '∞'; $('#timerBar').style.strokeDashoffset = 0; $('#timer').classList.remove('warn'); }
  $('#qType').textContent = TYPE_LABEL[t]; $('#qType').className = 'qtype t-' + t;
  $('#qCat').textContent = it.q.category || ''; $('#qText').textContent = it.q.text;
  const card = $('#qcard'); card.classList.remove('ok', 'bad'); card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  const area = $('#answerArea');
  if (t === 'tf') {
    area.innerHTML = `<div class="tf-grid"><button class="tf-btn tf-yes" data-i="0"><span>✔</span>ถูก</button><button class="tf-btn tf-no" data-i="1"><span>✘</span>ผิด</button></div>`;
    area.querySelectorAll('.tf-btn').forEach(b => b.onclick = () => answer(Number(b.dataset.i)));
  } else if (t === 'num') {
    const unit = it.q.choices[1] || '';
    area.innerHTML = `<div class="numpad"><div class="num-display" id="numDisp"><span id="numVal" class="ph">?</span><small>${esc(unit)}</small></div>
      <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" class="k-del">⌫</button><button data-k="0">0</button><button data-k="ok" class="k-ok">✓</button></div>
      <div class="num-correct hidden" id="numCorrect"></div></div>`;
    area.querySelectorAll('[data-k]').forEach(b => b.onclick = () => numKey(b.dataset.k));
  } else {
    area.innerHTML = `<div class="choices">${it.order.map((ci, i) => `<button class="choice" data-i="${i}"><span class="L">${LETTERS[i]}</span><span>${esc(it.q.choices[ci])}</span></button>`).join('')}</div>`;
    area.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(Number(b.dataset.i)));
  }
  showSection('play');
  g.servedAt = performance.now();
  if (g.mode === 'classic' || g.mode === 'survival') startTimer(g.servedAt + g.limit * 1000, g.limit);
}
function numKey(k) {
  const g = GAME; if (!g || g.locked) return;
  if (k === 'ok') { if (g.num === '') { $('#numDisp').classList.add('shake'); setTimeout(() => $('#numDisp')?.classList.remove('shake'), 400); return; } return answer(Number(g.num)); }
  if (k === 'del') g.num = g.num.slice(0, -1); else if (g.num.length < 4) g.num = (g.num === '0' ? '' : g.num) + k;
  const v = $('#numVal'); v.textContent = g.num || '?'; v.classList.toggle('ph', !g.num);
}
function onKey(e) {
  const g = GAME; if (!g || $('#play').classList.contains('hidden')) return;
  if (!$('#feedback').classList.contains('hidden')) { if (e.key === 'Enter') $('#nextBtn').click(); return; }
  if (g.locked) return;
  const t = qType(g.items[g.idx].q);
  if (t === 'num') { if (/^\d$/.test(e.key)) numKey(e.key); else if (e.key === 'Backspace') numKey('del'); else if (e.key === 'Enter') numKey('ok'); }
  else { const i = 'abcd1234'.indexOf(e.key.toLowerCase()) % 4; const n = t === 'tf' ? 2 : g.items[g.idx].order.length; if (i >= 0 && i < n) answer(i); }
}

function stopTimer() { if (RAF) cancelAnimationFrame(RAF); RAF = null; }
function stopTimerIfPerQ() { if (GAME && GAME.mode !== 'attack') stopTimer(); }
function startTimer(endTs, total) {
  stopTimer();
  const tick = () => {
    const left = Math.max(0, (endTs - performance.now()) / 1000);
    $('#timerNum').textContent = Math.ceil(left);
    $('#timerBar').style.strokeDashoffset = C_TIMER * (1 - left / total);
    $('#timer').classList.toggle('warn', left <= 5);
    if (GAME?.mode === 'attack') $('#progBar').style.width = (100 - left / total * 100) + '%';
    if (left <= 0) { stopTimer(); return onTimeUp(); }
    RAF = requestAnimationFrame(tick);
  };
  tick();
}
function onTimeUp() {
  const g = GAME; if (!g) return;
  if (g.mode === 'attack') { g.timeUp = true; if (!g.locked) { g.locked = true; finish(); } return; }
  answer(null);
}

function answer(value) {
  const g = GAME; if (!g || g.locked) return;
  g.locked = true; stopTimerIfPerQ();
  const it = g.items[g.idx], t = qType(it.q);
  const elapsed = Math.min(g.limit, (performance.now() - g.servedAt) / 1000);
  const timedOut = value === null;
  let correct = false, chosenText = '(หมดเวลา)', correctText;
  if (t === 'num') {
    const unit = it.q.choices[1] ? ' ' + it.q.choices[1] : '';
    correct = !timedOut && Number(value) === Number(it.q.choices[0]);
    if (!timedOut) chosenText = value + unit; correctText = it.q.choices[0] + unit;
  } else {
    correct = !timedOut && it.order[value] === it.q.answer;
    if (!timedOut) chosenText = it.q.choices[it.order[value]]; correctText = it.q.choices[it.q.answer];
  }
  let gained = 0;
  if (correct) {
    g.streak++; g.bestStreak = Math.max(g.bestStreak, g.streak); g.correct++;
    if (g.mode === 'attack') gained = 100 + (g.streak >= 3 ? 50 : 0);
    else if (g.mode !== 'practice') gained = 100 + Math.round(50 * Math.max(0, 1 - elapsed / g.limit)) + (g.streak >= 3 ? 25 : 0);
    g.points += gained;
  } else { g.streak = 0; if (g.mode === 'survival') g.lives--; }
  g.log.push({ questionNo: g.idx + 1, questionId: it.q.id, category: it.q.category || '', question: it.q.text, chosen: chosenText, correctAnswer: correctText,
    isCorrect: correct ? 'ถูก' : 'ผิด', timeSec: +elapsed.toFixed(1), points: gained, explanation: it.q.explanation || '' });

  // mark UI
  const area = $('#answerArea');
  if (t === 'num') {
    $('#numDisp').classList.add(correct ? 'ok' : 'bad');
    area.querySelectorAll('[data-k]').forEach(b => b.disabled = true);
    if (!correct) { const c = $('#numCorrect'); c.textContent = '✔ คำตอบที่ถูก: ' + correctText; c.classList.remove('hidden'); }
  } else {
    const btns = [...area.querySelectorAll('[data-i]')];
    btns.forEach(b => b.disabled = true);
    area.firstElementChild.classList.add('locked');
    const ci = t === 'tf' ? it.q.answer : it.order.indexOf(it.q.answer);
    btns[ci]?.classList.add('correct');
    if (!timedOut && !correct) btns[value]?.classList.add('wrong');
  }
  $('#pts').textContent = g.points; $('#streak').textContent = '🔥 ' + g.streak;
  if (g.mode === 'survival') $('#lives').textContent = '❤️'.repeat(Math.max(0, g.lives)) + '🤍'.repeat(Math.max(0, g.maxLives - g.lives));

function saveQuestion(e) {
  e.preventDefault();
  const f = e.target, t = f.type.value;
  if (!f.text.value.trim()) return toast('กรุณาใส่คำถาม');
  const base = { id: editingId || 'q' + Date.now().toString(36), type: t, category: f.category.value.trim(), text: f.text.value.trim(), explanation: f.explanation.value.trim(), active: f.active.checked, set: normSet(f.set.value) };
  let q;
  if (t === 'tf') q = { ...base, choices: ['ถูก', 'ผิด'], answer: Number(f.querySelector('input[name=tfAns]:checked').value) };
  else if (t === 'num') { if (f.numVal.value === '' || !Number.isFinite(Number(f.numVal.value))) return toast('กรุณาใส่คำตอบเป็นตัวเลข'); q = { ...base, choices: [String(Number(f.numVal.value)), f.numUnit.value.trim()], answer: 0 }; }

    ['Admin', esc(CONFIG.adminEmails.join(', ') || '-')],
  ];
  $('#sysInfo').innerHTML = rows.map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
}

boot();
</script>
</body>
</html>
